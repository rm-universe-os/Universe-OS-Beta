name: Assemble release asset
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.7.1-beta
      asset_name:
        description: Final asset filename
        required: true
      part_prefix:
        description: Part filename prefix
        required: true
      part_count:
        description: Number of parts
        required: true
      expected_sha256:
        description: Expected SHA-256 of the assembled file
        required: true
      expected_size:
        description: Expected size in bytes
        required: true
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Download parts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p parts
          gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern "${{ inputs.part_prefix }}*" --dir parts
          test "$(ls -1 parts | wc -l)" = "${{ inputs.part_count }}"
          ls -l parts | head -30
      - name: Assemble and verify
        run: |
          set -euo pipefail
          out="${{ inputs.asset_name }}"
          : > "$out"
          for f in $(find parts -type f -name "${{ inputs.part_prefix }}*" | sort); do cat "$f" >> "$out"; done
          printf '%s  %s\n' "${{ inputs.expected_sha256 }}" "$out" | sha256sum -c -
          test "$(stat -c%s "$out")" = "${{ inputs.expected_size }}"
      - name: Publish asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" "${{ inputs.asset_name }}" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Remove temporary parts
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rid=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/${{ inputs.tag }}" --jq .id)
          gh api "repos/$GITHUB_REPOSITORY/releases/$rid/assets" --jq '.[] | select(.name | startswith("${{ inputs.part_prefix }}")) | .id' | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" || true; done
